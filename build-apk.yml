name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Embutir bibliotecas (funcionar sem internet)
        run: |
          mkdir -p www/vendor/fa
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/
          cp node_modules/jszip/dist/jszip.min.js www/vendor/
          cp -r node_modules/@fortawesome/fontawesome-free/css node_modules/@fortawesome/fontawesome-free/webfonts www/vendor/fa/
          npx tailwindcss -i input.css -o www/tailwind.css --content "./www/index.html" --minify
      - run: npx cap add android
      - name: Permissões (GPS, câmera, internet)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: coletor-coordenadas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
